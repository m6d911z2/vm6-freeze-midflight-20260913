name: VM6 Auto Merge Revocation CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  vm6-auto-merge-ci:
    runs-on: ubuntu-latest
    steps:
      - name: ASCII anchor semantic probe
        shell: bash
        run: |
          printf '%s\n' 'VM6_PREFIX'
          printf '%s\n' 'VM6_ANCHOR'
          printf '%s\n' 'VM6_SUFFIX'
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          exit 1
